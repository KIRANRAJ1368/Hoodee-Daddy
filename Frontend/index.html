    <!-- ZMW Modern Logo Loading Screen Styles -->
    <style>
      #zmw-loading-screen {
        position: fixed;
        inset: 0;
        width: 100%;
        height: 100%;
        height: 100dvh;
        background-color: #FFFFFF;
        z-index: 999999;
        display: flex;
        align-items: center;
        justify-content: center;
        opacity: 1;
        visibility: visible;
        transition: opacity 0.5s cubic-bezier(0.16, 1, 0.3, 1), visibility 0.5s ease;
        pointer-events: auto;
        user-select: none;
        -webkit-user-select: none;
        overflow: hidden;
      }
      #zmw-loading-screen.zmw-loaded {
        opacity: 0;
        visibility: hidden;
        pointer-events: none;
      }
      .zmw-loading-inner {
        display: flex;
        flex-direction: column;
        align-items: center;
        justify-content: center;
        gap: 28px;
        padding: 24px;
        max-width: 90vw;
        animation: zmw-fade-in 0.35s ease-out forwards;
      }
      .zmw-loading-logo-box {
        display: flex;
        align-items: center;
        justify-content: center;
        min-height: 120px;
        animation: zmw-logo-subtle-pulse 2.4s ease-in-out infinite;
        will-change: transform, opacity;
      }
      .zmw-loading-brand-logo {
        display: block;
        width: 280px;
        max-width: 78vw;
        height: auto;
        max-height: 130px;
        aspect-ratio: 978 / 452;
        object-fit: contain;
      }
      .zmw-loading-bar-wrap {
        width: 160px;
        max-width: 50vw;
        height: 3.5px;
        background: rgba(17, 24, 39, 0.08);
        border-radius: 9999px;
        overflow: hidden;
        position: relative;
      }
      .zmw-loading-bar-fill {
        position: absolute;
        top: 0;
        left: 0;
        bottom: 0;
        width: 100%;
        background: linear-gradient(90deg, #FAA703 0%, #FFD066 50%, #FAA703 100%);
        border-radius: 9999px;
        transform: translateX(-100%);
        animation: zmw-loading-slide 1.35s cubic-bezier(0.45, 0, 0.25, 1) infinite;
        box-shadow: 0 0 10px rgba(250, 167, 3, 0.45);
      }
      @keyframes zmw-fade-in {
        from { opacity: 0; transform: translateY(6px); }
        to { opacity: 1; transform: translateY(0); }
      }
      @keyframes zmw-logo-subtle-pulse {
        0%, 100% { transform: scale(1); opacity: 0.96; }
        50% { transform: scale(1.025); opacity: 1; }
      }
      @keyframes zmw-loading-slide {
        0% { transform: translateX(-100%); }
        50% { transform: translateX(20%); }
        100% { transform: translateX(100%); }
      }
      @media (max-width: 768px) {
        .zmw-loading-brand-logo { width: 240px; max-height: 112px; }
        .zmw-loading-bar-wrap { width: 140px; height: 3px; }
        .zmw-loading-inner { gap: 24px; }
      }
      @media (max-width: 480px) {
        .zmw-loading-brand-logo { width: 200px; max-height: 94px; }
        .zmw-loading-bar-wrap { width: 120px; height: 2.5px; }
        .zmw-loading-inner { gap: 20px; }
      }
    </style>
  </head>
  <body>
    <!-- 1. Instant Clean Modern Logo Loading Screen -->
    <div id="zmw-loading-screen" role="status" aria-label="Loading ZMW">
      <div class="zmw-loading-inner">
        <div class="zmw-loading-logo-box">
          <img
            src="/images/zmw-logo-transparent.png"
            alt="ZMW"
            class="zmw-loading-brand-logo"
            width="280"
            height="130"
            fetchpriority="high"
          />
        </div>
        <div class="zmw-loading-bar-wrap" aria-hidden="true">
          <div class="zmw-loading-bar-fill"></div>
        </div>
      </div>
    </div>

    <script>
      (function() {
        var dismissed = false;

        window.__dismissZmwLoader = function() {
          if (dismissed) return;
          dismissed = true;
          var el = document.getElementById('zmw-loading-screen');
          if (!el) return;
          el.classList.add('zmw-loaded');
          setTimeout(function() {
            if (el && el.parentNode) {
              el.parentNode.removeChild(el);
            }
          }, 550);
        };

        // Safety fallback timer: guarantees loader never gets stuck if network stalls
        setTimeout(function() {
          if (typeof window.__dismissZmwLoader === 'function') {
            window.__dismissZmwLoader();
          }
        }, 4500);
      })();
    </script>

    <noscript>You need to enable JavaScript to run this app.</noscript>
    <div id="root"></div>
    <script type="module" src="/src/index.jsx"></script>
  </body>
