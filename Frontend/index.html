    <!-- HooDee Daddy Modern Logo Loading Screen Styles -->
    <style>
      #hd-loading-screen {
        position: fixed;
        inset: 0;
        width: 100%;
        height: 100%;
        height: 100dvh;
        background-color: #FFFFFF;
        z-index: 999999;
        display: flex;
        align-items: center;
        justify-content: center;
        opacity: 1;
        visibility: visible;
        transition: opacity 0.5s cubic-bezier(0.16, 1, 0.3, 1), visibility 0.5s ease;
        pointer-events: auto;
        user-select: none;
        -webkit-user-select: none;
        overflow: hidden;
      }
      #hd-loading-screen.hd-loaded {
        opacity: 0;
        visibility: hidden;
        pointer-events: none;
      }
      .hd-loading-inner {
        display: flex;
        flex-direction: column;
        align-items: center;
        justify-content: center;
        gap: 28px;
        padding: 24px;
        max-width: 90vw;
        animation: hd-fade-in 0.35s ease-out forwards;
      }
      .hd-loading-logo-box {
        display: flex;
        align-items: center;
        justify-content: center;
        min-height: 120px;
        animation: hd-logo-subtle-pulse 2.4s ease-in-out infinite;
        will-change: transform, opacity;
      }
      .hd-loading-brand-logo {
        display: block;
        width: 280px;
        max-width: 78vw;
        height: auto;
        max-height: 130px;
        aspect-ratio: 943 / 733;
        object-fit: contain;
      }
      .hd-loading-bar-wrap {
        width: 160px;
        max-width: 50vw;
        height: 3.5px;
        background: rgba(17, 24, 39, 0.08);
        border-radius: 9999px;
        overflow: hidden;
        position: relative;
      }
      .hd-loading-bar-fill {
        position: absolute;
        top: 0;
        left: 0;
        bottom: 0;
        width: 100%;
        background: linear-gradient(90deg, #ff7300 0%, #ffa347 50%, #ff7300 100%);
        border-radius: 9999px;
        transform: translateX(-100%);
        animation: hd-loading-slide 1.35s cubic-bezier(0.45, 0, 0.25, 1) infinite;
        box-shadow: 0 0 10px rgba(255, 115, 0, 0.45);
      }
      @keyframes hd-fade-in {
        from { opacity: 0; transform: translateY(6px); }
        to { opacity: 1; transform: translateY(0); }
      }
      @keyframes hd-logo-subtle-pulse {
        0%, 100% { transform: scale(1); opacity: 0.96; }
        50% { transform: scale(1.025); opacity: 1; }
      }
      @keyframes hd-loading-slide {
        0% { transform: translateX(-100%); }
        50% { transform: translateX(20%); }
        100% { transform: translateX(100%); }
      }
      @media (max-width: 768px) {
        .hd-loading-brand-logo { width: 240px; max-height: 112px; }
        .hd-loading-bar-wrap { width: 140px; height: 3px; }
        .hd-loading-inner { gap: 24px; }
      }
      @media (max-width: 480px) {
        .hd-loading-brand-logo { width: 200px; max-height: 94px; }
        .hd-loading-bar-wrap { width: 120px; height: 2.5px; }
        .hd-loading-inner { gap: 20px; }
      }
    </style>
    <!-- HooDee Daddy Official Favicon -->
    <link rel="icon" type="image/x-icon" href="/favicon.ico?v=hd1" />

  <body>
    <!-- 1. Instant Clean Modern Logo Loading Screen -->
    <div id="hd-loading-screen" role="status" aria-label="Loading HooDee Daddy">
      <div class="hd-loading-inner">
        <div class="hd-loading-logo-box">
          <img
            src="/images/hoodee-daddy-logo.svg"
            alt="HooDee Daddy"
            class="hd-loading-brand-logo"
            width="280"
            height="130"
            fetchpriority="high"
          />
        </div>
        <div class="hd-loading-bar-wrap" aria-hidden="true">
          <div class="hd-loading-bar-fill"></div>
        </div>
      </div>
    </div>

    <script>
      (function() {
        var dismissed = false;

        window.__dismissHdLoader = function() {
          if (dismissed) return;
          dismissed = true;
          var el = document.getElementById('hd-loading-screen');
          if (!el) return;
          el.classList.add('hd-loaded');
          setTimeout(function() {
            if (el && el.parentNode) {
              el.parentNode.removeChild(el);
            }
          }, 550);
        };

        // Safety fallback timer: guarantees loader never gets stuck if network stalls
        setTimeout(function() {
          if (typeof window.__dismissHdLoader === 'function') {
            window.__dismissHdLoader();
          }
        }, 4500);
      })();
    </script>

    <div id="root"></div>

  </body>
